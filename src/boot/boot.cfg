# boot.cfg - bootloader: laadt op $0801 (BASIC-SYS-regel), de resident part draait op $C000
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    BASIC:    file = %O, start = $0801, size = $0F00;
    HIGH:     file = "", start = $C000, size = $0F00;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = BASIC,    type = ro;
    STARTUP:  load = BASIC,    type = ro;
    CODE:     load = BASIC,    run = HIGH, type = rw, define = yes;
    BSS:      load = HIGH,     type = bss, define = yes;
}
